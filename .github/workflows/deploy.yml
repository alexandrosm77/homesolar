name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: homesolar-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run lint
        run: python -m ruff check .

  deploy:
    name: Deploy on Raspberry Pi
    needs: test
    runs-on: [self-hosted, homesolar-pi]
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify persistent config exists
        env:
          HOMESOLAR_CONFIG: /opt/homesolar/config/local.yaml
          HOMESOLAR_DATA_DIR: /opt/homesolar/data
        run: |
          test -f "$HOMESOLAR_CONFIG"
          mkdir -p "$HOMESOLAR_DATA_DIR"

      - name: Build and restart homesolar
        env:
          HOMESOLAR_CONFIG: /opt/homesolar/config/local.yaml
          HOMESOLAR_DATA_DIR: /opt/homesolar/data
          HOMESOLAR_PORT: "8000"
          REMOTE_INVERTER_USER: ${{ secrets.REMOTE_INVERTER_USER }}
          REMOTE_INVERTER_PASSWORD: ${{ secrets.REMOTE_INVERTER_PASSWORD }}
        run: docker compose up --build -d

      - name: Show service status
        run: docker compose ps
