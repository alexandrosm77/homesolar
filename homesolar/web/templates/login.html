<!doctype html>
<html lang="{{ lang }}" class="theme-{{ theme }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="icon" href="{{ asset_base_path }}/static/favicon.svg?v={{ asset_version }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ asset_base_path }}/static/css/app.css?v={{ asset_version }}">
  </head>
  <body class="login-body">
    <main class="login-shell">
      <form class="login-panel" method="post" action="">
        <div>
          <div class="brand">
            <img class="brand-logo" src="{{ asset_base_path }}/static/logo.svg?v={{ asset_version }}" alt="" width="40" height="40">
            <p class="eyebrow">{{ settings.app_name }}</p>
          </div>
          <h1>{{ t.sign_in }}</h1>
          <p class="login-copy">{{ t.login_copy }}</p>
        </div>
        {% if error %}
          <p class="login-error">{{ error }}</p>
        {% endif %}
        <label>
          <span>{{ t.username }}</span>
          <input name="username" type="text" autocomplete="username" required autofocus>
        </label>
        <label>
          <span>{{ t.password }}</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">{{ t.login }}</button>
        <nav class="lang-switch" aria-label="Language">
          {% for code, name in languages.items() %}
            <a class="{{ 'active' if lang == code else '' }}" href="?lang={{ code }}">{{ name }}</a>
          {% endfor %}
        </nav>
      </form>
    </main>
  </body>
</html>
