<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="icon" href="{{ asset_base_path }}/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="{{ asset_base_path }}/static/css/app.css">
  </head>
  <body class="login-body">
    <main class="login-shell">
      <form class="login-panel" method="post" action="">
        <div>
          <div class="brand">
            <img class="brand-logo" src="{{ asset_base_path }}/static/logo.svg" alt="" width="40" height="40">
            <p class="eyebrow">{{ settings.app_name }}</p>
          </div>
          <h1>Sign in</h1>
          <p class="login-copy">Solar production, collector health, and inverter events.</p>
        </div>
        {% if error %}
          <p class="login-error">{{ error }}</p>
        {% endif %}
        <label>
          <span>Username</span>
          <input name="username" type="text" autocomplete="username" required autofocus>
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Login</button>
      </form>
    </main>
  </body>
</html>
