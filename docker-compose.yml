services:
  homesolar:
    build: .
    container_name: homesolar
    restart: unless-stopped
    ports:
      - "${HOMESOLAR_PORT:-8000}:8000"
    environment:
      REMOTE_INVERTER_USER: ${REMOTE_INVERTER_USER:-}
      REMOTE_INVERTER_PASSWORD: ${REMOTE_INVERTER_PASSWORD:-}
    volumes:
      - ${HOMESOLAR_CONFIG:-./config/local.yaml}:/config/homesolar.yaml:ro
      - ${HOMESOLAR_DATA_DIR:-./data}:/app/data
